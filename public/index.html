<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Flight Radar</title>
<link rel="stylesheet" href="vendor/leaflet/leaflet.css">
<link rel="stylesheet" href="style.css">
</head>
<body>
<aside id="side">
  <header>
    <h1>Flight Radar</h1>
    <span id="status" title="Data status">connecting…</span>
  </header>

  <button id="toggleFilters" class="togglebar" aria-expanded="true" aria-controls="filters">
    <span id="filterSummary">Filters</span><span class="chev" aria-hidden="true">▾</span>
  </button>
  <section class="panel" id="filters">
    <label class="row">
      <span>Airport</span>
      <input id="airport" placeholder="ICAO e.g. KGEG" maxlength="4" spellcheck="false">
      <button id="go">Go</button>
    </label>
    <div id="aptName" class="muted"></div>
    <div class="seg" id="mode">
      <button data-mode="all">All traffic</button>
      <button data-mode="both">In + Out</button>
      <button data-mode="in">Inbound</button>
      <button data-mode="out">Outbound</button>
    </div>
    <label class="chk wide" title="Follows this airport's scheduled airline flights wherever they are, from the gate at the origin to landing. Untick to see everything nearby, including private aircraft.">
      <input type="checkbox" id="airlines"> Airline flights only (untick to add all nearby traffic)
    </label>
    <label class="row">
      <span>Search</span>
      <input id="search" placeholder="callsign, reg, type" spellcheck="false">
    </label>
    <div class="row">
      <span>Range</span>
      <select id="range">
        <option value="25">25 nm</option>
        <option value="50">50 nm</option>
        <option value="100">100 nm</option>
        <option value="150">150 nm</option>
        <option value="250">250 nm (max)</option>
      </select>
      <label class="chk"><input type="checkbox" id="hideGround"> hide ground</label>
    </div>
    <label class="row">
      <span>Altitude</span>
      <input id="altMin" type="number" placeholder="min ft" step="1000">
      <input id="altMax" type="number" placeholder="max ft" step="1000">
    </label>
    <label class="row">
      <span>Places</span>
      <select id="labels" title="Place names on the map">
        <option value="normal">Normal</option>
        <option value="faint">Faint</option>
        <option value="off">Off</option>
      </select>
    </label>
    <label class="chk wide"><input type="checkbox" id="selPaths"> Flight paths for the selected flight only</label>
  </section>

  <div id="count" class="muted"></div>
  <ul id="list"></ul>
  <div id="detail" hidden></div>
  <footer class="muted">
    Live data: <a href="https://adsb.fi" target="_blank" rel="noopener">adsb.fi</a> and <a href="https://adsb.lol" target="_blank" rel="noopener">adsb.lol</a> community ADS‑B feeds.
    Routes are looked up by callsign and can be out of date.
  </footer>
</aside>
<div id="map"></div>
<script src="vendor/leaflet/leaflet.js"></script>
<script src="app.js"></script>
</body>
</html>
